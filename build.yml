name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - run: unzip -q squirrelmod194.zip
      - run: gradle build
        working-directory: squirrelmod194
      - uses: actions/upload-artifact@v4
        with:
          name: squirrelmod-1.19.4-jar
          path: squirrelmod194/build/libs/*.jar
